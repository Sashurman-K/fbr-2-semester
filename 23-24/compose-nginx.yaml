services: # docker-compose -f compose-nginx.yaml up --build
  backend1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend1
    ports:
      - "3000:3000"
    networks:
      - app-network
    environment:
      - MSG=server-1

  backend2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend2
    ports:
      - "3001:3000"
    networks:
      - app-network
    environment:
      - MSG=server-2

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend1
      - backend2
    networks:
      - app-network

networks:
  app-network:
    driver: bridge